name: build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build
      # アニメーションの keyframes がライブラリの style.css に入っていることを確かめる
      - name: Check keyframes in dist/style.css
        run: |
          for name in mfm-spin mfm-spinX mfm-spinY mfm-jump mfm-bounce mfm-twitch mfm-shake mfm-rubberBand mfm-tada mfm-rainbow mfm-sparkle; do
            grep -q "@keyframes $name" dist/style.css || { echo "@keyframes $name が dist/style.css にない"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test

  # GitHub から入れたときの prepare は利用側の Node.js でビルドする。README に書いた最低の版でもビルドできることを確かめる
  build-min-node:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - run: npm ci
      - run: npm run build
